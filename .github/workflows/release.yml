name: Package and Release Addon

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      ADDON_NAME: CombatTelemetryEfficiency

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Lua files with luacheck
        uses: lunarmodules/luacheck@v1
        continue-on-error: true
        with:
          args: .

      - name: Validate tag matches TOC version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          TOC_VERSION=$(grep -E '^## Version:' "${ADDON_NAME}.toc" | awk '{print $3}' | tr -d '\r')
          echo "Tag version: ${TAG_VERSION} | TOC version: ${TOC_VERSION}"
          if [ "${TAG_VERSION}" != "${TOC_VERSION}" ]; then
            echo "Error: Git tag (${TAG_VERSION}) does not match ${ADDON_NAME}.toc Version (${TOC_VERSION})"
            exit 1
          fi

      - name: Package addon ZIP
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          PKG_DIR="dist/${ADDON_NAME}"
          mkdir -p "${PKG_DIR}"
          cp "${ADDON_NAME}.toc" Core.lua Collector.lua Analyzer.lua UI.lua README.md "${PKG_DIR}/"
          (cd dist && zip -r "../${ADDON_NAME}-${TAG_NAME}.zip" "${ADDON_NAME}")
          ls -lh "${ADDON_NAME}-${TAG_NAME}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ADDON_NAME }}-${{ github.ref_name }}.zip
          generate_release_notes: true

      - name: Upload release ZIP to CurseForge
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          PROJECT_ID: ${{ vars.CF_PROJECT_ID || '1815218' }}
        run: |
          if [ -z "${CF_API_KEY}" ]; then
            echo "CF_API_KEY is not set; skipping CurseForge upload."
            exit 0
          fi

          TAG_NAME="${GITHUB_REF_NAME}"
          ZIP_FILE="${ADDON_NAME}-${TAG_NAME}.zip"
          CHANGELOG=$(git tag -l --format='%(contents)' "${TAG_NAME}" | sed '/^-----BEGIN PGP SIGNATURE-----/,$d')
          if [ -z "${CHANGELOG}" ]; then
            CHANGELOG="Release ${TAG_NAME}"
          fi

          METADATA=$(jq -n \
            --arg changelog "${CHANGELOG}" \
            --arg displayName "${ADDON_NAME} ${TAG_NAME}" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersionNames: ["1.60.1"],
              releaseType: "release"
            }')

          HTTP_CODE=$(curl -s -o cf_response.json -w "%{http_code}" \
            -H "X-Api-Token: ${CF_API_KEY}" \
            -F "metadata=${METADATA}" \
            -F "file=@${ZIP_FILE}" \
            "https://wow.curseforge.com/api/projects/${PROJECT_ID}/upload-file")

          cat cf_response.json
          echo ""
          if [ "${HTTP_CODE}" -lt 200 ] || [ "${HTTP_CODE}" -ge 300 ]; then
            echo "CurseForge upload failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
